# Public-repo safety: never use pull_request_target. Self-hosted jobs must not
# run on fork pull requests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, box]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip until package.json exists
        id: ready
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet; CI will run fully after the site scaffold lands."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci
      - if: steps.ready.outputs.ready == 'true'
        run: npm run build
      - if: steps.ready.outputs.ready == 'true'
        run: npm test
